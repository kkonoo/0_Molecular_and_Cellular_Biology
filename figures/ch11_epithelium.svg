<text x="631.0" y="70.0" font-size="16" text-anchor="start" fill="#5B4D80" font-weight="700">① 밀착연접</text>
<text x="735.0" y="70.0" font-size="13" text-anchor="start" fill="#888">tight junction</text>
<text x="651.0" y="94.0" font-size="14" text-anchor="start" fill="#333">세포 사이 틈을 막음</text>
<text x="651.0" y="116.0" font-size="14" text-anchor="start" fill="#333">위·아래 막 성분을 나눔</text>
<text x="631.0" y="154.0" font-size="16" text-anchor="start" fill="#D9822B" font-weight="700">② 부착연접</text>
<text x="735.0" y="154.0" font-size="13" text-anchor="start" fill="#888">adherens junction</text>
<text x="651.0" y="178.0" font-size="14" text-anchor="start" fill="#333">cadherin으로 붙음</text>
<text x="651.0" y="200.0" font-size="14" text-anchor="start" fill="#333">안쪽은 actin과 연결</text>
<text x="631.0" y="238.0" font-size="16" text-anchor="start" fill="#333" font-weight="700">③ 데스모솜</text>
<text x="735.0" y="238.0" font-size="13" text-anchor="start" fill="#888">desmosome</text>
<text x="651.0" y="262.0" font-size="14" text-anchor="start" fill="#333">안쪽은 중간섬유와 연결</text>
<text x="651.0" y="284.0" font-size="14" text-anchor="start" fill="#333">잡아당기는 힘을 견딤</text>
<text x="631.0" y="322.0" font-size="16" text-anchor="start" fill="#1F7A7A" font-weight="700">④ 간극연접</text>
<text x="735.0" y="322.0" font-size="13" text-anchor="start" fill="#888">gap junction</text>
<text x="651.0" y="346.0" font-size="14" text-anchor="start" fill="#333">connexin 통로</text>
<text x="651.0" y="368.0" font-size="14" text-anchor="start" fill="#333">이온·작은 분자가 이웃으로</text>
