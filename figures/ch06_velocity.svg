<rect x="175.0" y="183.0" width="40.0" height="14.0" rx="2" fill="#5B4D80" stroke="none" stroke-width="1"/>
<text x="155.0" y="220.0" font-size="15" text-anchor="middle" fill="#D9822B" font-weight="700">unspliced (u)</text>
<text x="155.0" y="239.0" font-size="13" text-anchor="middle" fill="#555">intron이 남은 미성숙 RNA</text>
<path d="M222.0 190.0 L300.0 250.0 M293.1 248.9 L300.0 250.0 L297.2 243.6" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="268.0" y="202.0" font-size="15" text-anchor="start" fill="#333" font-weight="700">β  splicing</text>
<rect x="310.0" y="261.0" width="40.0" height="14.0" rx="2" fill="#5B4D80" stroke="none" stroke-width="1"/>
<rect x="350.0" y="261.0" width="40.0" height="14.0" rx="2" fill="#5B4D80" stroke="none" stroke-width="1"/>
<rect x="390.0" y="262.0" width="26.0" height="12.0" rx="6" fill="#f6e3cc" stroke="#D9822B" stroke-width="1"/>
<text x="360.0" y="298.0" font-size="15" text-anchor="middle" fill="#1F7A7A" font-weight="700">spliced (s)</text>
<text x="360.0" y="317.0" font-size="13" text-anchor="middle" fill="#555">성숙 mRNA</text>
<path d="M360.0 328.0 L360.0 360.0 M356.6 353.9 L360.0 360.0 L363.4 353.9" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="372.0" y="352.0" font-size="15" text-anchor="start" fill="#333" font-weight="700">γ  분해</text>
<text x="44.0" y="336.0" font-size="15" text-anchor="start" fill="#333" font-weight="700">du/dt = α − β·u</text>
<text x="44.0" y="360.0" font-size="15" text-anchor="start" fill="#333" font-weight="700">ds/dt = β·u − γ·s</text>
<text x="44.0" y="388.0" font-size="13" text-anchor="start" fill="#555">u가 s보다 먼저 반응 → 둘의 비율이 변화 방향을 알려 줌</text>
<rect x="475.0" y="10.0" width="435.0" height="400.0" rx="10" fill="#f7f6fa" stroke="#d9d3e6" stroke-width="1"/>
<text x="491.0" y="38.0" font-size="16" text-anchor="start" fill="#333" font-weight="700">② 세포마다 (s, u)를 찍으면</text>
