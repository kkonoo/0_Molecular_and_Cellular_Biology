<text x="155.0" y="96.0" font-size="14" text-anchor="middle" fill="#333" font-weight="700">유전자 (DNA)</text>
<path d="M155.0 126.0 L155.0 158.0 M151.6 151.9 L155.0 158.0 L158.4 151.9" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="166.0" y="148.0" font-size="15" text-anchor="start" fill="#333" font-weight="700">α  전사</text>
<line x1="95.0" y1="190.0" x2="215.0" y2="190.0" stroke="#D9822B" stroke-width="3"/>
