<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" aria-label="RNA velocity 모식도. 왼쪽: 유전자에서 전사되어 intron이 남은 unspliced RNA가 되고, splicing으로 spliced mRNA가 되고, 분해됨. 오른쪽: 세포마다 spliced 양을 가로축, unspliced 양을 세로축에 찍으면 정상상태 선 위의 세포는 켜지는 중, 아래의 세포는 꺼지는 중">
<rect width="920" height="420" fill="#ffffff"/>
<rect x="10.0" y="10.0" width="450.0" height="400.0" rx="10" fill="#f7f6fa" stroke="#d9d3e6" stroke-width="1"/>
<text x="26.0" y="38.0" font-size="16" text-anchor="start" fill="#333" font-weight="700">① 한 유전자의 RNA가 거치는 단계</text>
<rect x="30" y="58" width="250" height="250" rx="22" fill="#ffffff" stroke="#bbb" stroke-dasharray="5,4"/>
<text x="44.0" y="80.0" font-size="14" text-anchor="start" fill="#555" font-weight="700">핵</text>
