<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" aria-label="+ 가닥 유전자 하나의 구조: 멀리 있는 enhancer, promoter와 TSS, exon 3개와 intron 2개, 5'UTR·CDS·3'UTR, polyA 신호, 그리고 전사와 splicing을 거친 pre-mRNA와 성숙한 mRNA">
