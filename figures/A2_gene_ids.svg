<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" aria-label="Ensembl 유전자 ID를 접두, 종 코드, 객체 종류, 번호, 버전으로 나누어 읽는 법과, 같은 유전자에 유전자·전사체·단백질 층마다 다른 ID가 붙는 구조">
<rect width="920" height="560" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="10" y="10" width="900" height="236" rx="10" fill="#f7f6fa" stroke="#d9d3e6" stroke-width="1.2"/>
