<path d="M717 362 q8 -10 0 -20 q-8 -10 0 -20 q8 -10 0 -20 q-8 -10 0 -20 q8 -10 0 -20" stroke="#1F7A7A" stroke-width="3" fill="none" marker-end="url(#aht)"/>
<text x="742" y="266" font-size="14" fill="#1F7A7A" text-anchor="start" font-weight="700">mRNA</text>
<text x="742" y="285" font-size="14" fill="#1F7A7A" text-anchor="start" font-weight="700">← RNA-seq이 세는 것</text>
<line x1="717" y1="244" x2="717" y2="216" stroke="#888" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="4,3"/>
<text x="726" y="236" font-size="14" fill="#555" text-anchor="start">번역</text>
<rect x="600" y="176" width="220" height="36" rx="8" fill="#fbeaea" stroke="#C0392B" stroke-width="1.5"/>
<text x="710.0" y="198.9" font-size="14" fill="#C0392B" text-anchor="middle" font-weight="700">억제 단백질 (SOCS, DUSP 등)</text>
