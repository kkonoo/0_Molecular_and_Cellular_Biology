<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 545" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" aria-label="pre-mRNA 가공 모식도. 유전자 DNA가 전사되어 exon과 intron을 모두 가진 pre-mRNA가 되고, 5' cap이 붙고, intron이 GU로 시작해 AG로 끝나는 경계에서 잘려 나가며, 3' 끝이 잘린 뒤 poly(A) 꼬리가 붙어 성숙 mRNA가 됨">
