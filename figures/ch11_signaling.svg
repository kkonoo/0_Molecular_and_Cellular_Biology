<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" aria-label="세포 간 신호 모식도: 분비 신호에서는 송신 세포가 내보낸 리간드가 수신 세포 수용체에 붙고, 접촉 신호(Notch)에서는 맞닿은 두 세포의 막 리간드와 수용체가 붙음. 아래는 scRNA-seq에서 cell type별 리간드와 수용체 mRNA로 상호작용 후보를 고르는 방식">
