<text x="548.0" y="80.0" font-size="13" fill="#555" text-anchor="start">신호가 오면</text>
<text x="548.0" y="97.0" font-size="13" fill="#555" text-anchor="start">돌아오기도 함</text>
<rect x="622.0" y="124.0" width="296.0" height="352.0" rx="10" fill="#f7f6fa" stroke="#d9d3e6" stroke-width="1"/>
<text x="638.0" y="152.0" font-size="16" fill="#333" text-anchor="start" font-weight="700">검문점: 넘어가도 되나?</text>
<circle cx="650.0" cy="185.0" r="12.0" fill="#ffffff" stroke="#C0392B" stroke-width="2"/>
<text x="650.0" y="190.0" font-size="14" fill="#C0392B" text-anchor="middle" font-weight="700">1</text>
<text x="670.0" y="190.0" font-size="15" fill="#333" text-anchor="start" font-weight="700">G1/S 검문점 (제한점)</text>
<text x="670.0" y="212.0" font-size="13" fill="#555" text-anchor="start">성장 신호가 충분한가?</text>
<text x="670.0" y="231.0" font-size="13" fill="#555" text-anchor="start">DNA 손상은 없나?</text>
<text x="670.0" y="252.0" font-size="13" fill="#1F7A7A" text-anchor="start" font-weight="700">Rb–E2F, p53 → p21</text>
<circle cx="650.0" cy="287.0" r="12.0" fill="#ffffff" stroke="#C0392B" stroke-width="2"/>
<text x="650.0" y="292.0" font-size="14" fill="#C0392B" text-anchor="middle" font-weight="700">2</text>
<text x="670.0" y="292.0" font-size="15" fill="#333" text-anchor="start" font-weight="700">G2/M 검문점</text>
<text x="670.0" y="314.0" font-size="13" fill="#555" text-anchor="start">DNA 복제가 끝났나?</text>
<text x="670.0" y="333.0" font-size="13" fill="#555" text-anchor="start">손상은 없나?</text>
<text x="670.0" y="354.0" font-size="13" fill="#1F7A7A" text-anchor="start" font-weight="700">ATM·ATR → CHK1·CHK2</text>
<circle cx="650.0" cy="389.0" r="12.0" fill="#ffffff" stroke="#C0392B" stroke-width="2"/>
<text x="650.0" y="394.0" font-size="14" fill="#C0392B" text-anchor="middle" font-weight="700">3</text>
<text x="670.0" y="394.0" font-size="15" fill="#333" text-anchor="start" font-weight="700">방추사 검문점 (M기 안)</text>
<text x="670.0" y="416.0" font-size="13" fill="#555" text-anchor="start">모든 염색체가 방추사에</text>
<text x="670.0" y="435.0" font-size="13" fill="#555" text-anchor="start">붙었나?</text>
<text x="670.0" y="456.0" font-size="13" fill="#1F7A7A" text-anchor="start" font-weight="700">MAD2·BUBR1 → APC/C 억제</text>
<text x="20.0" y="516.0" font-size="13" fill="#888" text-anchor="start">호 길이 = 24시간 주기 예시의 단계별 시간 비율. C = 세포 하나의 DNA 양 단위(G1의 이배체 세포 = 2C)</text>
