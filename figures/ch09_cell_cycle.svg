<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 530" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" aria-label="세포주기 원형 모식도: G1, S, G2, M 단계와 G0, 세 검문점, 단계별 DNA 양 2C에서 4C">
