<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 462" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" aria-label="대체 splicing으로 생기는 isoform 두 개와 read의 배정. exon 4개짜리 유전자에서 isoform A는 exon 3을 포함하고 isoform B는 exon 3을 건너뜀. exon 1, 2, 4 안의 read는 둘 다에서 나올 수 있고, exon 3이나 exon 2-3 경계 read는 A에서만, exon 2-4 경계 read는 B에서만 나올 수 있음">
