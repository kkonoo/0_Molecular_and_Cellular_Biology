<path d="M158 88 L158 80 L370 80 L370 88" stroke="#5B4D80" stroke-width="1.8" fill="none"/>
<text x="264.0" y="72.0" font-size="15" text-anchor="middle" fill="#5B4D80" font-weight="700">start 3, end 6 → [3, 6]</text>
<line x1="40.0" y1="168.0" x2="40.0" y2="180.0" stroke="#1F7A7A" stroke-width="2"/>
