<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" aria-label="염기 10개 위에 그린 두 좌표계. 1-based는 글자마다 1부터 번호를 붙이고 양끝을 포함하며, 0-based는 글자 사이 경계에 0부터 번호를 붙이고 끝을 포함하지 않음. 같은 구간 GTTG가 1-based로는 3부터 6, 0-based로는 2부터 6">
