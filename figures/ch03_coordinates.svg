<path d="M152 208 L152 216 L376 216 L376 208" stroke="#1F7A7A" stroke-width="1.8" fill="none"/>
<text x="264.0" y="234.0" font-size="15" text-anchor="middle" fill="#1F7A7A" font-weight="700">start 2, end 6 → [2, 6)</text>
<text x="40.0" y="288.0" font-size="15" text-anchor="start" fill="#1F7A7A" font-weight="700">0-based, 반열림 (BED): 글자 사이 경계에 번호, end 경계는 미포함</text>
<rect x="630.0" y="50.0" width="290.0" height="200.0" rx="10" fill="#f7f6fa" stroke="#d9d3e6" stroke-width="1"/>
<text x="648.0" y="80.0" font-size="16" text-anchor="start" fill="#333" font-weight="700">같은 구간 GTTG</text>
<text x="648.0" y="110.0" font-size="15" text-anchor="start" fill="#5B4D80" font-weight="700">GTF: start 3, end 6</text>
<text x="648.0" y="131.0" font-size="15" text-anchor="start" fill="#333">길이 = 6 − 3 + 1 = 4</text>
<text x="648.0" y="163.0" font-size="15" text-anchor="start" fill="#1F7A7A" font-weight="700">BED: start 2, end 6</text>
<text x="648.0" y="184.0" font-size="15" text-anchor="start" fill="#333">길이 = 6 − 2 = 4</text>
<text x="648.0" y="216.0" font-size="15" text-anchor="start" fill="#C0392B" font-weight="700">BED start = GTF start − 1</text>
<text x="648.0" y="237.0" font-size="14" text-anchor="start" fill="#555">end 숫자는 두 방식이 같음</text>
</svg>
