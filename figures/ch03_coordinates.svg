<line x1="96.0" y1="168.0" x2="96.0" y2="180.0" stroke="#1F7A7A" stroke-width="2"/>
<text x="96.0" y="198.0" font-size="16" text-anchor="middle" fill="#1F7A7A" font-weight="700">1</text>
<line x1="152.0" y1="168.0" x2="152.0" y2="180.0" stroke="#1F7A7A" stroke-width="2"/>
<text x="152.0" y="198.0" font-size="16" text-anchor="middle" fill="#1F7A7A" font-weight="700">2</text>
