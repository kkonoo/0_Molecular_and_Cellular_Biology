<rect x="500" y="352" width="200.0" height="26" rx="0" fill="#5B4D80" stroke="none" stroke-width="1"/>
<text x="600.0" y="370" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">exon</text>
<rect x="700.0" y="352" width="200.0" height="26" rx="0" fill="#9d9d9d" stroke="none" stroke-width="1"/>
<text x="800.0" y="370" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">intron</text>
<rect x="900.0" y="352" width="0.0" height="26" rx="0" fill="#D9822B" stroke="none" stroke-width="1"/>
<text x="40" y="404" font-size="15" text-anchor="start" fill="#555">성숙 mRNA가 대부분 → exon read 위주</text>
<text x="40" y="424" font-size="15" text-anchor="start" fill="#555">MT- read가 있음 (손상되면 더 많아짐)</text>
<text x="500" y="404" font-size="15" text-anchor="start" fill="#555">pre-mRNA 비중이 큼 → intron read 많음</text>
<text x="500" y="424" font-size="15" text-anchor="start" fill="#555">MT- read는 거의 없어야 정상</text>
<text x="500" y="444" font-size="15" text-anchor="start" fill="#C0392B">(많으면 세포질이 덜 벗겨진 신호)</text>
