<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" aria-label="단백질의 일생: 합성, 접힘, 수식, 위치, 분해의 다섯 단계와 각 단계가 데이터에서 보이는지">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B4D80"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A7A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9822B"/></marker><marker id="bar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M5,0 L5,10" stroke="#C0392B" stroke-width="2.4"/></marker><marker id="bark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M5,0 L5,10" stroke="#333" stroke-width="2.4"/></marker></defs>
<rect width="920" height="380" fill="#ffffff"/>
<rect x="20" y="40" width="164" height="196" rx="8" fill="#f7f6fa" stroke="#d9d3e6" stroke-width="1"/>
<text x="102.0" y="28" font-size="16" fill="#333" text-anchor="middle" font-weight="700">① 합성</text>
<text x="102.0" y="198" font-size="14" fill="#555" text-anchor="middle">리보솜이 mRNA를 읽어</text>
<text x="102.0" y="217" font-size="14" fill="#555" text-anchor="middle">아미노산 사슬을 만듦</text>
<path d="M185 138 l12 0 m-5 -5 l5 5 l-5 5" stroke="#888" stroke-width="2" fill="none"/>
<rect x="20" y="262" width="164" height="58" rx="8" fill="#e8f4f3" stroke="#b9dcd8" stroke-width="1"/>
<text x="102.0" y="284" font-size="14" fill="#1F7A7A" text-anchor="middle">RNA-seq은 이 단계의</text>
<text x="102.0" y="303" font-size="14" fill="#1F7A7A" text-anchor="middle">재료(mRNA)를 셈</text>
<rect x="199" y="40" width="164" height="196" rx="8" fill="#f7f6fa" stroke="#d9d3e6" stroke-width="1"/>
<text x="281.0" y="28" font-size="16" fill="#333" text-anchor="middle" font-weight="700">② 접힘</text>
<text x="281.0" y="198" font-size="14" fill="#555" text-anchor="middle">사슬이 3차원 모양으로</text>
<text x="281.0" y="217" font-size="14" fill="#555" text-anchor="middle">접힘, 샤페론이 도움</text>
<path d="M364 138 l12 0 m-5 -5 l5 5 l-5 5" stroke="#888" stroke-width="2" fill="none"/>
<rect x="199" y="262" width="164" height="58" rx="8" fill="#e8f4f3" stroke="#b9dcd8" stroke-width="1"/>
<text x="281.0" y="284" font-size="14" fill="#1F7A7A" text-anchor="middle">접힘 상태는</text>
<text x="281.0" y="303" font-size="14" fill="#1F7A7A" text-anchor="middle">시퀀싱에 안 보임</text>
<rect x="378" y="40" width="164" height="196" rx="8" fill="#f7f6fa" stroke="#d9d3e6" stroke-width="1"/>
<text x="460.0" y="28" font-size="16" fill="#333" text-anchor="middle" font-weight="700">③ 수식 (PTM)</text>
<text x="460.0" y="198" font-size="14" fill="#555" text-anchor="middle">인산화·당화·</text>
<text x="460.0" y="217" font-size="14" fill="#555" text-anchor="middle">유비퀴틴화·아세틸화</text>
<path d="M543 138 l12 0 m-5 -5 l5 5 l-5 5" stroke="#888" stroke-width="2" fill="none"/>
<rect x="378" y="262" width="164" height="58" rx="8" fill="#e8f4f3" stroke="#b9dcd8" stroke-width="1"/>
<text x="460.0" y="284" font-size="14" fill="#1F7A7A" text-anchor="middle">mRNA에 흔적 없음</text>
<text x="460.0" y="303" font-size="14" fill="#1F7A7A" text-anchor="middle">→ 단백질을 직접 재야</text>
<rect x="557" y="40" width="164" height="196" rx="8" fill="#f7f6fa" stroke="#d9d3e6" stroke-width="1"/>
<text x="639.0" y="28" font-size="16" fill="#333" text-anchor="middle" font-weight="700">④ 위치</text>
<text x="639.0" y="198" font-size="14" fill="#555" text-anchor="middle">신호 서열을 따라</text>
<text x="639.0" y="217" font-size="14" fill="#555" text-anchor="middle">핵·막·분비 등으로</text>
<path d="M722 138 l12 0 m-5 -5 l5 5 l-5 5" stroke="#888" stroke-width="2" fill="none"/>
<rect x="557" y="262" width="164" height="58" rx="8" fill="#e8f4f3" stroke="#b9dcd8" stroke-width="1"/>
<text x="639.0" y="284" font-size="14" fill="#1F7A7A" text-anchor="middle">세포 표면 단백질은</text>
<text x="639.0" y="303" font-size="14" fill="#1F7A7A" text-anchor="middle">CITE-seq으로 셀 수 있음</text>
<rect x="736" y="40" width="164" height="196" rx="8" fill="#f7f6fa" stroke="#d9d3e6" stroke-width="1"/>
<text x="818.0" y="28" font-size="16" fill="#333" text-anchor="middle" font-weight="700">⑤ 분해</text>
<text x="818.0" y="198" font-size="14" fill="#555" text-anchor="middle">프로테아좀 또는</text>
<text x="818.0" y="217" font-size="14" fill="#555" text-anchor="middle">리소좀에서 분해</text>
<rect x="736" y="262" width="164" height="58" rx="8" fill="#e8f4f3" stroke="#b9dcd8" stroke-width="1"/>
<text x="818.0" y="284" font-size="14" fill="#1F7A7A" text-anchor="middle">분해 속도가</text>
<text x="818.0" y="303" font-size="14" fill="#1F7A7A" text-anchor="middle">단백질 양을 좌우</text>
<text x="20" y="254" font-size="14" fill="#1F7A7A" text-anchor="start" font-weight="700">데이터에서는</text>
