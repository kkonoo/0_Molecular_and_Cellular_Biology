<text x="655.0" y="368.0" font-size="14" text-anchor="start" fill="#333" font-weight="700">dCas9: 자르는 기능을 없앤 Cas9</text>
<text x="655.0" y="396.0" font-size="14" text-anchor="start" fill="#1F7A7A" font-weight="700">+ 억제 단백질 → CRISPRi</text>
<text x="670.0" y="418.0" font-size="14" text-anchor="start" fill="#555">전사를 낮춤</text>
